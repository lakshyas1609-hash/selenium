
<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f0f0f0;
            text-align: center;
            margin-top: 100px;
        }

        .login-box {
            background: white;
            width: 300px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            padding: 10px 25px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        #message {
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Login Page</h2>

        <form id="loginForm">

            <input type="text"
                   id="username"
                   placeholder="Enter Username">

            <input type="password"
                   id="password"
                   placeholder="Enter Password">

            <br>

            <button type="submit" id="loginBtn">
                Login
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script>
        document.getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            let username =
                document.getElementById("username").value;

            let password =
                document.getElementById("password").value;

            let message =
                document.getElementById("message");

            if (username === "admin" &&
                password === "admin123") {

                message.style.color = "green";
                message.innerHTML = "Login Successful";

            } else {

                message.style.color = "red";
                message.innerHTML = "Invalid Username or Password";

            }
        });
    </script>

</body>
</html>
